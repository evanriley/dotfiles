music_directory         "/mnt/Media/Music"
playlist_directory      "~/.local/share/mpd/playlists"
db_file                 "~/.cache/mpd/database"
log_file                "~/.local/state/mpd/log"
pid_file                "$XDG_RUNTIME_DIR/mpd.pid"
state_file              "~/.local/state/mpd/state"
auto_update             "yes"
follow_outside_symlinks "yes"
follow_inside_symlinks  "yes"
restore_paused "yes"

# binding to socket is another option.
bind_to_address         "127.0.0.1"
port                    "6600"

audio_buffer_size "4096"
buffer_before_play "20%"


# if alsa, probably nothing is needed.
# if pulse, uncomment and edit /etc/pulse/client.conf for autospawn = yes
 audio_output {
         type            "pipewire"
         name            "MPD Output"
         mixer_type      "software"
 }
