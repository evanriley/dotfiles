[main]
include=/home/evan/.local/state/darkman/foot.ini
shell=fish
font=Berkeley Mono:size=13:fontfeatures=-calt:-liga:-dlig, Symbols Nerd Font Mono:size=13
pad=8x8
[cursor]
style=block
blink=no
[mouse]
hide-when-typing=yes
[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative
indicator-format=""

# The 16-color palettes stay here rather than in the darkman-generated include
# because foot switches between these two blocks itself on SIGUSR1/SIGUSR2,
# with no config reload. A generated file can only ever hold one mode, so
# moving the palette there would cost foot its instant, in-place mode switch.
# Values are verbatim from extras/foot/kanso-{zen,pearl}.ini upstream.

# Four grey slots deviate from extras/foot/*.ini, each taking the value the
# sibling upstream ports agree on instead. Light bright7 was #f2f1ef, identical
# to the background, so bold-white text was invisible; light regular7 #9f9f99
# sat at 2.36:1. The bright0 pair comes from the theme's own nvim terminal
# table and matches the `muted` role the rest of the desktop uses for dim text.

[colors-dark]
foreground=c5c9c7
background=090e13
selection-foreground=c5c9c7
selection-background=22262d
urls=72a7bc
cursor=090e13 c5c9c7

regular0=090e13
regular1=c4746e
regular2=8a9a7b
regular3=c4b28a
regular4=8ba4b0
regular5=a292a3
regular6=8ea4a2
regular7=a4a7a4

bright0=909398
bright1=e46876
bright2=87a987
bright3=e6c384
bright4=7fb4ca
bright5=938aa9
bright6=7aa89f
bright7=c5c9c7

16=b6927b
17=b98d7b

[colors-light]
foreground=22262d
background=f2f1ef
selection-foreground=22262d
selection-background=e2e1df
urls=73a7bc
cursor=f2f1ef 22262d

regular0=22262d
regular1=c84053
regular2=6f894e
regular3=77713f
regular4=4d699b
regular5=b35b79
regular6=597b75
regular7=545464

bright0=6D6D69
