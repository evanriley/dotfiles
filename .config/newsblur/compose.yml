services:
  newsblur_web:
    hostname: nb.com
    container_name: newsblur_web
    image: docker.io/newsblur/newsblur_python3:latest
    environment:
      DOCKERBUILD: "True"
      RUNWITHMAKEBUILD: "False"
    env_file: /var/home/evan/.local/share/media-stack/newsblur/newsblur.env
    entrypoint: /bin/sh -c newsblur_web/entrypoint.sh
    depends_on:
      - newsblur_db_mongo
      - newsblur_db_postgres
      - newsblur_db_redis
      - newsblur_db_elasticsearch
    restart: unless-stopped
    ulimits:
      nproc: 10000
      nofile:
        soft: 10000
        hard: 10000
    volumes:
      - /var/home/evan/.local/share/media-stack/newsblur/app:/srv/newsblur:z
      - /var/home/evan/.config/newsblur/local_settings.py:/srv/newsblur/newsblur_web/local_settings.py:ro,z
    networks:
      newsblur:
        ipv4_address: 10.89.50.10

  newsblur_node:
    container_name: newsblur_node
    image: docker.io/newsblur/newsblur_node:latest
    user: "1000:1000"
    environment:
      NODE_ENV: docker
      MONGODB_PORT: "29019"
    command: node newsblur.js
    restart: unless-stopped
    stop_signal: HUP
    depends_on:
      - newsblur_db_mongo
      - newsblur_db_postgres
      - newsblur_db_redis
    volumes:
      - /var/home/evan/.local/share/media-stack/newsblur/app/node:/srv:z
    networks:
      newsblur:
        ipv4_address: 10.89.50.11

  newsblur_imageproxy:
    container_name: newsblur_imageproxy
    image: ghcr.io/willnorris/imageproxy:latest
    user: "1000:1000"
    entrypoint: /app/imageproxy -addr 0.0.0.0:8088 -cache /tmp/imageproxy -verbose
    restart: unless-stopped
    volumes:
      - /var/home/evan/.local/share/media-stack/newsblur/data/imageproxy:/tmp/imageproxy:Z
    networks:
      newsblur:
        ipv4_address: 10.89.50.12

  newsblur_nginx:
    container_name: newsblur_nginx
    image: docker.io/library/nginx:1.19.6
    environment:
      DOCKERBUILD: "True"
    restart: unless-stopped
    depends_on:
      - newsblur_web
      - newsblur_node
    volumes:
      - /var/home/evan/.local/share/media-stack/newsblur/app/docker/nginx/nginx.local.conf:/etc/nginx/conf.d/nginx.conf:ro,z
      - /var/home/evan/.local/share/media-stack/newsblur/app:/srv/newsblur:z
    networks:
      newsblur:
        ipv4_address: 10.89.50.13

  newsblur_db_postgres:
    container_name: newsblur_db_postgres
    image: docker.io/library/postgres:13.1
    environment:
      POSTGRES_USER: newsblur
      POSTGRES_PASSWORD: newsblur
    restart: unless-stopped
    volumes:
      - /var/home/evan/.local/share/media-stack/newsblur/data/postgres:/var/lib/postgresql/data:Z
    networks:
      newsblur:
        ipv4_address: 10.89.50.20

  newsblur_db_redis:
    container_name: newsblur_db_redis
    image: docker.io/library/redis:latest
    command: redis-server /etc/redis/redis.conf --port 6579
    restart: unless-stopped
    volumes:
      - /var/home/evan/.local/share/media-stack/newsblur/app/docker/redis/redis.conf:/etc/redis/redis.conf:ro,z
      - /var/home/evan/.local/share/media-stack/newsblur/app/docker/redis/redis_server.conf:/usr/local/etc/redis/redis_replica.conf:ro,z
      - /var/home/evan/.local/share/media-stack/newsblur/data/redis:/data:Z
    networks:
      newsblur:
        ipv4_address: 10.89.50.21

  newsblur_db_elasticsearch:
    container_name: newsblur_db_elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    mem_limit: 2g
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms384m -Xmx384m
      cluster.routing.allocation.disk.threshold_enabled: "false"
      xpack.security.enabled: "false"
      bootstrap.memory_lock: "false"
      indices.breaker.total.use_real_memory: "false"
    restart: unless-stopped
    volumes:
      - /var/home/evan/.local/share/media-stack/newsblur/data/elasticsearch:/usr/share/elasticsearch/data:Z
      - /var/home/evan/.local/share/media-stack/newsblur/app/config/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro,z
    networks:
      newsblur:
        ipv4_address: 10.89.50.22

  newsblur_db_mongo:
    container_name: newsblur_db_mongo
    image: docker.io/library/mongo:4.0
    command: mongod --port 29019 --wiredTigerEngineConfigString=checkpoint=(wait=60),file_manager=(close_idle_time=0)
    restart: unless-stopped
    volumes:
      - /var/home/evan/.local/share/media-stack/newsblur/data/mongo:/data/db:Z
    networks:
      newsblur:
        ipv4_address: 10.89.50.23

  newsblur_celery:
    container_name: newsblur_celery
    image: docker.io/newsblur/newsblur_python3:latest
    command: celery worker -A newsblur_web -B --loglevel=INFO
    environment:
      DOCKERBUILD: "True"
    env_file: /var/home/evan/.local/share/media-stack/newsblur/newsblur.env
    restart: unless-stopped
    depends_on:
      - newsblur_db_mongo
      - newsblur_db_postgres
      - newsblur_db_redis
      - newsblur_db_elasticsearch
    volumes:
      - /var/home/evan/.local/share/media-stack/newsblur/app:/srv/newsblur:z
      - /var/home/evan/.config/newsblur/local_settings.py:/srv/newsblur/newsblur_web/local_settings.py:ro,z
    networks:
      newsblur:
        ipv4_address: 10.89.50.30

  newsblur_mcp:
    container_name: newsblur_mcp
    image: docker.io/newsblur/newsblur_mcp:latest
    environment:
      PYTHONPATH: /srv/newsblur_mcp
      NEWSBLUR_BASE_URL: http://newsblur_web:8000
      MCP_PORT: "8099"
      MCP_HOST: 0.0.0.0
      MCP_OAUTH_CLIENT_ID: newsblur-mcp-server
      MCP_OAUTH_BASE_URL: https://cinderace.tailfe05b.ts.net/mcp
      MCP_OAUTH_UPSTREAM_URL: https://cinderace.tailfe05b.ts.net
      MCP_OAUTH_INTERNAL_URL: http://newsblur_web:8000
      MCP_REDIS_URL: redis://newsblur_db_redis:6579/5
    env_file: /var/home/evan/.local/share/media-stack/newsblur/newsblur.env
    restart: unless-stopped
    depends_on:
      - newsblur_web
      - newsblur_db_redis
    networks:
      newsblur:
        ipv4_address: 10.89.50.31

  newsblur_haproxy:
    container_name: newsblur_haproxy
    image: docker.io/library/haproxy:latest
    restart: unless-stopped
    depends_on:
      - newsblur_nginx
      - newsblur_web
      - newsblur_node
      - newsblur_imageproxy
      - newsblur_mcp
    ports:
      - 127.0.0.1:8082:8082
    volumes:
      - /var/home/evan/.local/share/media-stack/newsblur/app/docker/haproxy/haproxy.docker-compose.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro,z
      - /var/home/evan/.local/share/media-stack/newsblur/app:/srv/newsblur:z
    networks:
      newsblur:
        ipv4_address: 10.89.50.40

networks:
  newsblur:
    name: newsblur
    ipam:
      config:
        - subnet: 10.89.50.0/24
          gateway: 10.89.50.1
