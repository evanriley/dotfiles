$font = Berkeley Mono

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = kanso, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, kanso
    animation = fadeOut, 1, 4, kanso
    animation = inputFieldDots, 1, 3, kanso
}

background {
    monitor =
    color = rgb(090e13)
}

label {
    monitor =
    text = $TIME
    color = rgb(e6c384)
    font_size = 84
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgb(c5c9c7)
    font_size = 20
    font_family = $font
    position = 0, 35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 420, 54
    outline_thickness = 2
    rounding = 6
    dots_size = 0.22
    dots_spacing = 0.32
    outer_color = rgb(c4b28a)
    inner_color = rgb(090e13)
    font_color = rgb(c5c9c7)
    check_color = rgb(7aa89f)
    fail_color = rgb(e46876)
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    fade_on_empty = false
    position = 0, -55
    halign = center
    valign = center
}
