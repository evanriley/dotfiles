$font = Berkeley Mono

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgb(000000)
}

label {
    monitor =
    text = locked
    color = rgba(ffffff24)
    font_size = 14
    font_family = $font
    position = 0, 52
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 34
    outline_thickness = 1
    rounding = 3
    dots_size = 0.18
    dots_spacing = 0.28
    outer_color = rgba(ffffff18)
    inner_color = rgb(000000)
    font_color = rgba(ffffff45)
    check_color = rgba(ffffff45)
    fail_color = rgba(e4687645)
    font_family = $font
    placeholder_text =
    fail_text = $PAMFAIL
    fade_on_empty = true
    position = 0, 0
    halign = center
    valign = center
}
