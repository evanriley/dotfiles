# Corne Mini + Neovim. Ctrl-B: hold right-hand Ctrl (') and tap B.
set -g prefix C-b
bind C-b send-prefix
set -g default-terminal tmux-256color
set -s terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,foot*:RGB'
set -s escape-time 10
set -s extended-keys on
set -g focus-events on
set -g default-shell /usr/bin/fish
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
setw -g mode-keys vi
set -g status-keys vi
set -g set-clipboard external
set -s copy-command 'wl-copy --type text/plain'
set -g update-environment 'DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WAYLAND_DISPLAY WINDOWID XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS'

# All navigation needs the prefix; plain Ctrl/Alt keys reach Neovim and fish.
# No repeat flag here: typing after a pane switch must reach the application.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5
bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind n next-window
bind p previous-window
bind Tab last-pane
bind Space next-layout
bind w choose-tree -Zw
bind f copy-mode
bind y paste-buffer -p
bind g display-popup -E -w 90% -h 90% -d '#{pane_current_path}' lazygit
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux configuration reloaded'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

set -g status-position top
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 60
set -g status-left ' #S '
set -g status-right '#{?client_prefix, PREFIX ,}#{?pane_in_mode, COPY ,}#{?window_zoomed_flag, ZOOM ,} #H | %H:%M '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '

# Kanso Zen fallback, followed by darkman's current palette when available.
set -g @kanso-bg '#090E13'
set -g @kanso-bg-alt '#1C1E25'
set -g @kanso-selection '#22262D'
set -g @kanso-border '#393B44'
set -g @kanso-muted '#909398'
set -g @kanso-fg '#C5C9C7'
set -g @kanso-blue '#8ba4b0'
set -g @kanso-red '#c4746e'
source-file ~/.config/tmux/theme.conf
run-shell 'sh "$HOME/.config/tmux/load-theme"'
# Also refresh named servers on attach after a detached light/dark transition.
set-hook -g client-attached 'run-shell "sh ~/.config/tmux/load-theme"'
