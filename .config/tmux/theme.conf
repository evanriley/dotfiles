# Styles expand the palette options at draw time, including during live changes.
set -g status-style 'bg=#{@kanso-bg-alt},fg=#{@kanso-fg}'
set -g status-left-style 'bg=#{@kanso-blue},fg=#{@kanso-bg},bold'
set -g status-right-style 'fg=#{@kanso-muted}'
setw -g window-status-style 'fg=#{@kanso-muted}'
setw -g window-status-current-style 'bg=#{@kanso-selection},fg=#{@kanso-fg},bold'
setw -g window-status-activity-style 'fg=#{@kanso-blue}'
setw -g window-status-bell-style 'fg=#{@kanso-red},bold'
set -g pane-border-style 'fg=#{@kanso-border}'
set -g pane-active-border-style 'fg=#{@kanso-blue}'
setw -g mode-style 'bg=#{@kanso-selection},fg=#{@kanso-fg}'
set -g message-style 'bg=#{@kanso-bg-alt},fg=#{@kanso-fg}'
set -g message-command-style 'bg=#{@kanso-bg-alt},fg=#{@kanso-blue}'
set -gF display-panes-colour '#{@kanso-muted}'
set -gF display-panes-active-colour '#{@kanso-blue}'
set -g popup-style 'bg=#{@kanso-bg},fg=#{@kanso-fg}'
set -g popup-border-style 'fg=#{@kanso-blue}'
