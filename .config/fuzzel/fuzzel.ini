[main]
font=Berkeley Mono:size=14, Symbols Nerd Font:size=14

dpi-aware=no
exit-on-keyboard-focus-loss=no
hide-before-typing=no
horizontal-pad=40
icons-enabled=yes
image-size-ratio=0.5
inner-pad=20
keyboard-focus=exclusive
layer=overlay
letter-spacing=0
lines=15
match-counter=yes
match-mode=fuzzy
prompt="λ "  
show-actions=no
sort-result=yes
tabs=8
terminal=kitty -e
use-bold=no
vertical-pad=20
width=60

[border]
radius=0
width=1

[colors]
# Luna palette
background=060606ff
text=e4e4e8ff
prompt=c2916aff
placeholder=7c7c7cff
border=404040ff
selection=384048ff
selection-text=f0f0f0ff
match=75a1c7ff
selection-match=c4a8d6ff

[dmenu]
exit-immediately-if-empty=no
mode=text
