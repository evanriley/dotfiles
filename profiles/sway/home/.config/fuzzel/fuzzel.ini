[main]
font=Berkeley Mono:size=14, Symbols Nerd Font:size=14

dpi-aware=no
exit-on-keyboard-focus-loss=no
hide-before-typing=no
horizontal-pad=40
icons-enabled=yes
image-size-ratio=0.5
inner-pad=20
keyboard-focus=exclusive
layer=overlay
letter-spacing=0
lines=15
match-counter=yes
match-mode=fuzzy
prompt="λ "
show-actions=no
sort-result=yes
tabs=8
terminal=foot -e
use-bold=no
vertical-pad=20
width=60

[border]
radius=0
width=1

[dmenu]
exit-immediately-if-empty=no
mode=text
[colors]
background=090e13fa
text=c5c9c7ff
match=c4b28aff
selection=22262dff
selection-text=c5c9c7ff
selection-match=c4b28aff
border=8ba4b0ff
[border]
width=2
radius=8
