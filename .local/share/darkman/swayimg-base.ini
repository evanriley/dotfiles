[general]
mode = viewer
size = 1280,800
position = auto
overlay = no
decoration = no
sigusr1 = reload
app_id = swayimg

[viewer]
scale = optimal
position = center
antialiasing = mks13
loop = yes
history = 8
preload = 2

[slideshow]
time = 5
scale = fit
position = center
antialiasing = mks13

[gallery]
size = 200
cache = 100
preload = yes
pstore = yes
fill = yes
antialiasing = mks13

[list]
order = alpha
reverse = no
recursive = no
all = yes
fsmon = yes

[font]
name = Berkeley Mono
size = 13

[info]
show = yes
info_timeout = 4
status_timeout = 3

[info.viewer]
top_left = +name,+format,+filesize,+imagesize
top_right = index
bottom_left = scale,frame
bottom_right = status
