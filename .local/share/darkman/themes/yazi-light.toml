# Modus Themes for Yazi
# Auto generated with https://github.com/miikanissi/modus-themes.nvim/blob/master/lua/modus-themes/extras/yazi.lua

[mgr]
# NOTE: can combined with tmTheme (sublime colorshceme file) for preview code highlight
# syntect_theme = "path/to/tmTheme"

cwd = { fg = "#005e8b", italic = true }

# Find
find_keyword  = { fg = "#000000", bg = "#dfa0f0", bold = true }
find_position = { fg = "#3548cf", bg = "#f2f2f2", bold = true }

# Marker
marker_copied   = { fg = "#316500", bg = "#316500" }
marker_cut      = { fg = "#a60000", bg = "#a60000" }
marker_marked   = { fg = "#721045", bg = "#721045" }
marker_selected = { fg = "#0031a9", bg = "#0031a9" }

# Count
count_copied   = { fg = "#ffffff", bg = "#316500" }
count_cut      = { fg = "#ffffff", bg = "#972500" }
count_selected = { fg = "#ffffff", bg = "#3548cf" }

# Border
border_symbol = "│"
border_style  = { fg = "#3b3b3b" }

[tabs]
active   = { fg = "#ffffff", bg = "#0031a9" }
inactive = { fg = "#595959", bg = "#ffffff" }

# Indicator of the hovered file
[indicator]
parent  = { bg = "#dae5ec" }
current = { bg = "#dae5ec" }
preview = { bg = "#dae5ec" }

# Mode
[mode]
normal_main = { fg = "#ffffff", bg = "#0031a9", bold = true }
select_main = { fg = "#ffffff", bg = "#8f0075", bold = true }
unset_main  = { fg = "#ffffff", bg = "#8a290f", bold = true }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#595959", bold = true }
progress_normal = { fg = "#ffffff" }
progress_error  = { fg = "#a60000" }

# Permissions
perm_type  = { fg = "#0031a9" }
perm_read  = { fg = "#6f5500" }
perm_write = { fg = "#a60000" }
perm_exec  = { fg = "#006800" }
perm_sep   = { fg = "#595959" }

[pick]
border   = { fg = "#3b3b3b" }
active   = { fg = "#000000",  bg = "#9f9f9f" }
inactive = { fg = "#000000" }

# Input
[input]
border   = { fg = "#0000b0" }
title    = {}
value    = { fg = "#8f0075" }
selected = { bg = "#9f9f9f" }

# Completion
[cmp]
border   = { fg = "#0000b0" }
active   = { fg = "#000000", bg = "#9f9f9f" }
inactive = { fg = "#000000" }

# Tasks
[tasks]
border  = { fg = "#3b3b3b" }
title   = {}
hovered = { fg = "#000000", bg="#9f9f9f" }

# Which
[which]
cols = 3
mask            = { bg = "#f0f0f0" }
cand            = { fg = "#005e8b" }
rest            = { fg = "#0031a9" }
desc            = { fg = "#721045" }
separator       = "  "
separator_style = { fg = "#595959" }

# Notify
[notify]
title_info  = { fg = "#0000b0" }
title_warn  = { fg = "#6f5500" }
title_error = { fg = "#a60000" }

# Help
[help]
on      = { fg = "#006800" }
run     = { fg = "#721045" }
hovered = { bg = "#9f9f9f" }
footer  = { fg = "#000000", bg = "#f0f0f0" }

[filetype]

rules = [
	# Images
	{ mime = "image/*", fg = "#005e8b" },

	# Media
	{ mime = "{audio,video}/*", fg = "#884900" },

	# Archives
	{ mime = "application/*zip", fg = "#721045" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#721045" },

	# Documents
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#005e8b" },

	# Empty files
	# { mime = "inode/x-empty", fg = "#a60000" },

	# Special files
	{ url = "*", is = "orphan", bg = "#a60000" },
	{ url = "*", is = "exec"  , fg = "#006800" },

	{ url = "*.rs", fg = "#8a290f" },

	# Fallback
	{ url = "*/", fg = "#0031a9" }
]
